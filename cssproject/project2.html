<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Calculator Grid</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100vw;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: rgb(31, 31, 196);
}

#container{
    width:300px;
    height:420px;
    padding:10px;
    display:grid;
    gap:8px;
    background:#222;
}

.items{
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:20px;
    color:rgb(251, 251, 251);
    border:1px solid #898787;
    background:#555;
}

.display{
    grid-column:1 / 5;
    background:rgb(11, 5, 5);
    justify-content:flex-end;
    padding-right:10px;
    font-size:26px;
}

.ac{
    grid-column:1 / 3;
    background:#6b3333;
}

.equal{
    grid-row:5 / 7;
    grid-column:4 / 5;
    background:#173d5a;
}

.zero{
    grid-column:1 / 3;
}

.operator{
    background:#aea8a8;
}
</style>
</head>

<body>

<div id="container">
    <div class="items display">0</div>

    <div class="items ac">AC</div>
    <div class="items operator">/</div>
    <div class="items operator">×</div>

    <div class="items">7</div>
    <div class="items">8</div>
    <div class="items">9</div>
    <div class="items operator">−</div>

    <div class="items">4</div>
    <div class="items">5</div>
    <div class="items">6</div>
    <div class="items operator">+</div>

    <div class="items">1</div>
    <div class="items">2</div>
    <div class="items">3</div>
    <div class="items equal">=</div>

    <div class="items zero">0</div>
    <div class="items">.</div>
</div>

</body>
</html>
